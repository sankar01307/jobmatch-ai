{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-1">Create Job Seeker Account</h3>
        <p class="text-muted small mb-4">Already registered? <a href="{{ url_for('login') }}">Login here</a>.</p>

        <form method="post" class="row g-3" autocomplete="off">
          <div class="col-12">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="John Doe" required autofocus>
          </div>

          <div class="col-12">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" minlength="6"
                   placeholder="••••••" required>
            <div class="form-text">Min. 6 characters</div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm" class="form-control" minlength="6"
                   placeholder="••••••" required>
          </div>

          <div class="col-12 d-grid mt-2">
            <button class="btn btn-success btn-lg">Create Account</button>
          </div>
        </form>

        <hr class="my-4">
        <p class="text-muted small mb-0 text-center">
          Admin? Use the seeded credentials at <code>/login</code>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
